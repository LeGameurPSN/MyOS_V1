name: Build PSN_OS ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso debian-archive-keyring

      - name: Builder l'ISO
        working-directory: .
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: Récupérer le nom de l'ISO générée
        id: iso
        run: |
          ISO_FILE=$(ls psnos-*.iso | head -n1)
          echo "iso_file=$ISO_FILE" >> "$GITHUB_OUTPUT"

      - name: Uploader l'ISO en artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnos-iso
          path: ${{ steps.iso.outputs.iso_file }}
          retention-days: 14

      - name: Créer une Release (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.iso.outputs.iso_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
